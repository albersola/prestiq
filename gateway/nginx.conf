# Runs as an unprivileged user: every writable path lives under /tmp/nginx.
worker_processes auto;
pid /tmp/nginx/nginx.pid;
error_log stderr warn;

env CONFIG_DIR;
env CONFIG_TTL;

events {
    worker_connections 1024;
}

http {
    client_body_temp_path /tmp/nginx/client_body;
    proxy_temp_path /tmp/nginx/proxy;
    fastcgi_temp_path /tmp/nginx/fastcgi;
    uwsgi_temp_path /tmp/nginx/uwsgi;
    scgi_temp_path /tmp/nginx/scgi;

    lua_package_path "/opt/?.lua;;";
    lua_shared_dict gateway_config 10m;
    init_by_lua_block {
        require "gateway.handler"
        require("gateway.config").get()
    }

    # Upstreams are chosen per request, so nginx resolves them at runtime.
    resolver local=on ipv6=off valid=30s;
    resolver_timeout 5s;

    server_tokens off;
    sendfile off;

    # Never log headers or query strings: they may carry credentials.
    log_format gateway '$remote_addr [$time_iso8601] "$request_method $uri" '
                       '$status $body_bytes_sent client=$client_id service=$service '
                       'rt=$request_time';
    access_log /dev/stdout gateway;

    server {
        listen 8080;
        include /etc/gateway/nginx/routes.conf;
    }

    include /tmp/nginx/servers/*.conf;
}
