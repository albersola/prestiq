# Test environment: same gateway, pointed at mocks and fake credentials.
services:
  gateway:
    environment:
      CONFIG_TTL: "1"
    volumes:
      - ./test/data:/etc/gateway/data:ro
      - ./test/data/tls:/etc/gateway/tls:ro
      - ./test:/tests:ro
    depends_on:
      mock-github:
        condition: service_healthy

  mock-github:
    build: ./test/mocks
    command: ["python", "-u", "github.py"]
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8001))"]
      interval: 2s
      retries: 10
